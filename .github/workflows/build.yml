name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ['1.21.1', '1.21.3', '1.21.4', '1.21.5', '1.21.8', '1.21.10', '1.21.11', '26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - run: chmod +x gradlew && ./gradlew build --no-daemon "-Ptarget=${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.target }}
          path: build/libs/*.jar
